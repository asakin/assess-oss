name: Publish

on:
  push:
    tags:
      - 'v*'

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - run: |
          want="$(npm pkg get version | tr -d '"')"
          [ "v$want" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME != package version $want"; exit 1; }
          [ "$(node bin/assess-oss.mjs --version)" = "assess-oss $want" ] || { echo "CLI version != package version $want"; exit 1; }
      - run: npm test
      - run: npm run check
      - run: npm run test:package
      - run: npm stage publish
